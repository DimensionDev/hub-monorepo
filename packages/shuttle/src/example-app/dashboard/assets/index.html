<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="color-scheme" content="light dark"><title>投影状态 · Shuttle</title>
 <link rel="stylesheet" href="/styles.css"><script defer src="/app.js"></script>
</head>
<body>
 <div class="app-shell">
  <aside class="sidebar" id="sidebar">
   <a class="brand" href="/" aria-label="Shuttle 投影状态首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 18V6h4v4h6V6h4v12h-4v-5H9v5H5Z" fill="currentColor"/></svg></span><span>Shuttle<span class="brand-sub">业务投影</span></span></a>
   <button class="nav-overview active" id="overview-nav" data-view="overview"><span data-icon="grid"></span><span>状态总览</span><span class="nav-count" id="all-count">–</span></button>
   <div class="nav-heading">投影</div>
   <nav id="projection-nav" aria-label="投影"></nav>
   <div class="nav-heading">操作</div>
   <nav aria-label="操作"><button class="nav-table" id="runs-nav" data-view="runs"><span class="nav-dot"></span><span class="nav-table-name">运行记录</span><span class="nav-badge hidden" id="running-count"></span></button></nav>
   <div class="sidebar-bottom"><span class="connection-dot"></span><span id="env-label" class="env-label">本机 · 读取中…</span></div>
  </aside>
  <div class="main-shell">
   <header class="topbar"><div class="topbar-left"><button id="menu-toggle" aria-controls="sidebar" aria-expanded="false" class="icon-button mobile-only" aria-label="打开菜单" data-icon="menu"></button><span class="breadcrumb">Shuttle<span class="breadcrumb-divider">/</span><span id="crumb">投影状态</span></span></div><div class="topbar-right"><span id="update-time" class="update-time">读取中…</span><button class="button small" id="refresh" aria-label="刷新"><span data-icon="refresh"></span><span class="action-label">刷新</span></button></div></header>
   <main id="main" tabindex="-1">
    <div id="global-error" class="notice error hidden" role="alert"></div>
    <section class="page-heading"><div><div class="eyebrow" id="page-eyebrow">Shuttle</div><h1 id="page-title">投影状态</h1><p id="page-description">实时投影、数据缺口与 backfill / 重建记录</p></div><div id="heading-action"></div></section>
    <section id="metrics" class="metric-grid" aria-label="统计"></section>
    <div id="view"></div>
   </main>
  </div>
 </div>
 <div id="drawer-overlay" class="drawer-overlay hidden"></div>
 <aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1"></aside>
 <div id="toast" class="toast hidden" role="status"></div>
 <dialog id="action-dialog" aria-labelledby="action-title"><div class="repair-header"><h2 id="action-title">操作</h2><button class="icon-button" id="close-action" aria-label="关闭">×</button></div><div id="action-content" class="repair-content"></div></dialog>
</body>
</html>
