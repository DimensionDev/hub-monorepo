name: Release Packages

# Publishes the workspace packages to GitHub Packages (npm.pkg.github.com) and
# opens/updates the changesets "Version Packages" pull request on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight release: a half-finished publish would leave packages
# out of sync with the changesets state.
concurrency:
  group: "release-packages"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-node writes an .npmrc that maps the @dimensiondev scope to
      # https://npm.pkg.github.com and authenticates with ${NODE_AUTH_TOKEN}.
      # NOTE: The GitHub token (secrets.GITHUB_TOKEN) is sufficient to publish to
      # GitHub Packages; no custom npm token is required.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dimensiondev"

      - name: Restore cached dependencies for Node modules.
        id: module-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}--node--${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: |
          npx node-gyp@12.2.0 install
          yarn install

      # NOTE: Pull requests opened by changesets/action with secrets.GITHUB_TOKEN
      # do not trigger other workflows (GitHub suppresses recursive runs), so CI
      # will not run on the "Version Packages" PR automatically. If that is
      # required, create a PAT secret (e.g. secrets.RELEASE_PAT with repo + workflow
      # scope) and use it for GITHUB_TOKEN below instead.
      - name: Create Release Pull Request or Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1.9.0
        with:
          publish: yarn release-packages
          version: yarn version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The .npmrc written by setup-node reads the registry token from this variable.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
